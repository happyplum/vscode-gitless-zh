<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<style nonce="#{cspNonce}">
			@font-face {
				font-family: 'codicon';
				src: url('#{root}/dist/webviews/codicon.ttf?404cbc4fe3a64b9a93064eef76704c79') format('truetype');
			}
		</style>
	</head>

	<body class="preload">
		<!-- <canvas class="snow"></canvas> -->

		<div class="container">
			<header>
				<h2>GitLess 交互式 Rebase</h2>
				<h4 id="subhead"></h4>
			</header>
			<ul id="entries" class="entries"></ul>
			<div class="shortcuts">
				<span class="shortcut"><kbd>p</kbd><span>保留</span></span>
				<span class="shortcut"><kbd>r</kbd><span>改写</span></span>
				<span class="shortcut"><kbd>e</kbd><span>编辑</span></span>
				<span class="shortcut"><kbd>s</kbd><span>压缩</span></span>
				<span class="shortcut"><kbd>d</kbd><span>丢弃</span></span>
				<span class="shortcut"><kbd>alt ↑</kbd><span>向上移动</span></span>
				<span class="shortcut"><kbd>alt ↓</kbd><span>下移</span></span>
			</div>
			<div class="actions">
				<div class="actions--left">
					<button name="disable" class="button button--flat-subtle" data-action="disable" tabindex="-1">
						禁用变基编辑器<span class="shortcut">将中止变基</span>
					</button>
					<button name="switch" class="button button--flat-subtle" data-action="switch" tabindex="-1">
						切换到文本
					</button>
					<!--
					<div class="snow__trigger-container">
						<img
							class="snow__trigger snow__trigger--centered"
							title="Let it snow — Happy Holidays!"
							alt="Let it snow — Happy Holidays!"
							src="#{root}/images/snowman.png"
						/>
					</div>
					-->
				</div>
				<div class="actions--right">
					<button name="start" class="button button--flat-primary" data-action="start">
						开始变基 <span class="shortcut">Ctrl+Enter</span>
					</button>
					<button name="abort" class="button button--flat-secondary" data-action="abort">
						中止 <span class="shortcut">Ctrl+A</span>
					</button>
				</div>
			</div>
		</div>
		#{endOfBody}
	</body>
</html>
