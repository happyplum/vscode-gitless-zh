<section id="views" class="section--settings section--collapsible">
	<div class="section__header">
		<h2>
			浏览次数
			<a
				class="link__learn-more"
				title="了解更多"
				href="https://github.com/eamodio/vscode-gitlens/#side-bar-views-"
			>
				<i class="icon icon__info"></i>
			</a>
		</h2>

		<p class="section__header-hint">添加丰富的视图以进行可视化、导航和探索</p>
	</div>

	<div class="section__collapsible">
		<div class="section__group">
			<div class="section__content">
				<p class="blurb mt-0">
					GitLess 视图可以配置为以不同的侧边栏布局显示，以最好地匹配您的
					工作流程
				</p>
				<div class="presets mb-1">
					<div class="preset">
						<a
							class="button button--flat"
							title="在源代码管理侧栏上一起显示所有视图"
							href="command:gitlens.setViewsLayout?%7B%22layout%22%3A%22scm%22%7D"
							>源代码管理布局（默认）</a
						>
						<p>在源代码管理侧栏上一起显示所有视图</p>
					</div>
					<div class="preset">
						<a
							class="button button--flat"
							title="在 GitLess 侧栏上一起显示所有视图"
							href="command:gitlens.setViewsLayout?%7B%22layout%22%3A%22gitlens%22%7D"
							>GitLess 布局</a
						>
						<p>在 GitLess 侧栏上一起显示所有视图</p>
					</div>
				</div>

				<p class="section__hint">
					<i class="icon icon__info"></i> 您还可以简单地拖动&amp;放置各个视图来创建
					自定义布局
				</p>
			</div>
		</div>
	</div>
</section>
