<section id="shortcuts" class="section--settings section--collapsible">
	<div class="section__header">
		<h2>键盘快捷键</h2>
	</div>

	<div class="section__collapsible">
		<div class="section__group">
			<div class="section__content">
				<div class="setting">
					<div class="setting__input">
						<label for="keymap">使用</label>
						<div class="select-container">
							<select id="keymap" name="keymap" data-setting>
								<option value="alternate">基于替代</option>
								<option value="chorded">和弦（默认）</option>
								<option value="none">用户定义</option>
							</select>
						</div>
						<label for="keymap"> 键盘快捷键</label>
					</div>
					<span class="setting__hint hidden" data-visibility="keymap =alternate">
						<kbd>替代</kbd> 基于（<kbd>&#x2325;</kbd>
						在 macOS 上) 快捷方式。不太适合非英语键盘布局
					</span>
					<span class="setting__hint hidden" data-visibility="keymap =chorded">
						开头的和弦快捷键
						<kbd>Ctrl+Shift+G</kbd> (<kbd>&#x2325;&#x2318;G</kbd>
						在 macOS 上）。更适合非英语键盘布局
					</span>
					<span class="setting__hint hidden" data-visibility="keymap =none">
						GitLess 不会绑定任何键盘快捷键。通过以下方式配置您自己的
						<a
							class="command"
							title="打开键盘快捷键"
							href="command:workbench.action.openGlobalKeybindings"
							>键盘快捷键</a
						>
						编辑
					</span>
				</div>
			</div>
		</div>

		<div class="section__group">
			<p class="section__hint">
				<i class="icon icon__info"></i> 搜索 <b><i>吉伦斯</i></b> 在
				<a class="command" title="打开键盘快捷键" href="command:workbench.action.openGlobalKeybindings"
					>键盘快捷键</a
				>
				编辑器查看快捷方式并进一步自定义它们
			</p>
		</div>
	</div>
</section>
