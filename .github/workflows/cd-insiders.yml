name: Build Insiders

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build Insiders
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Enable Yarn
              run: corepack enable
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Apply insiders patch
              run: yarn run patch-insiders
            - name: Package extension
              run: yarn run pack
            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                  name: gitless-zh-insiders.vsix
                  path: '*.vsix'
