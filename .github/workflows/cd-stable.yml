name: Build Stable

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build Stable
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - name: Enable Yarn
              run: corepack enable
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Test
              run: yarn test
            - name: Package extension
              run: yarn run pack
            - name: Upload package
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: gitless-zh-stable.vsix
                  path: '*.vsix'
